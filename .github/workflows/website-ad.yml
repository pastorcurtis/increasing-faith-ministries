name: Daily Website Ad

# Posts one Facebook ad per day whose only job is driving traffic to
# increasingfaith.net. Separate from "Daily Social Media" (the teaching post,
# 9 AM) and "Post IFM Clips" (9 AM + 4 PM) so the three do not collide.

on:
  schedule:
    # 12 PM EST / 1 PM EDT (5 PM UTC) every day — sits between the morning
    # teaching post and the afternoon clip.
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      day_override:
        description: 'Force day of week (0=Sun, 6=Sat). Leave empty for today.'
        required: false
      preview_only:
        description: 'Preview only (generate + render, do not post)'
        type: boolean
        default: false
      use_fallback:
        description: 'Skip the AI and use the static copy for the day'
        type: boolean
        default: false

permissions:
  issues: write
  contents: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Facebook credentials are fatal; a missing AI key is not, because ad.js
      # falls back to static copy rather than skipping the day.
      - name: Validate secrets
        run: |
          MISSING=""
          if [ -z "${{ secrets.FACEBOOK_PAGE_TOKEN }}" ]; then MISSING="$MISSING FACEBOOK_PAGE_TOKEN"; fi
          if [ -z "${{ secrets.FACEBOOK_PAGE_ID }}" ]; then MISSING="$MISSING FACEBOOK_PAGE_ID"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi
          if [ -z "${{ secrets.GROQ_API_KEY }}" ] && [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "::warning::No AI provider key set -- the ad will post using static fallback copy."
          fi
          echo "Required secrets present"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: social-agent
        run: npm install

      - name: Generate and post website ad
        working-directory: social-agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.day_override }}" != "" ]; then
            ARGS="$ARGS --day ${{ github.event.inputs.day_override }}"
          fi
          if [ "${{ github.event.inputs.preview_only }}" = "true" ]; then
            ARGS="$ARGS --preview"
          fi
          if [ "${{ github.event.inputs.use_fallback }}" = "true" ]; then
            ARGS="$ARGS --fallback"
          fi
          node ad.js $ARGS

      # Always uploaded so the rendered ad can be reviewed even on a failed run.
      - name: Upload ad graphic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-ad
          path: social-agent/output/ad-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit ad archive
        if: ${{ github.event.inputs.preview_only != 'true' }}
        run: |
          git config user.name "IFM Ad Agent"
          git config user.email "ad-agent@increasingfaith.net"
          git add content/ad-archive/ || true
          if git diff --staged --quiet; then
            echo "No new ad archive to commit"
          else
            git commit -m "Website ad for $(date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Create failure alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Website Ad failed - ${date}`,
              body: [
                '## Daily Website Ad Failure',
                '',
                `**Date:** ${date}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'The daily website ad failed to generate or post.',
                'The rendered graphic (if any) is attached to the run as an artifact.',
                '',
                '*Auto-generated by IFM Ad Agent*'
              ].join('\n'),
              labels: ['social-media', 'automated'],
              assignees: ['pastorcurtis']
            });
