name: Daily Website Ad

# Posts one Facebook ad per day whose only job is driving traffic to
# increasingfaith.net. Separate from "Daily Social Media" (the teaching post,
# 9 AM) and "Post IFM Clips" (9 AM + 4 PM) so the three do not collide.

on:
  schedule:
    # 12 PM EST / 1 PM EDT (5 PM UTC) every day — sits between the morning
    # teaching post and the afternoon clip.
    - cron: '0 17 * * *'
    # Catch-up pass. GitHub drops and delays scheduled runs under load: on
    # 2026-08-06 this workflow failed with "job was not acquired by Runner of
    # type hosted" and, having only one slot, lost the day outright. This run
    # no-ops if today's ad already posted. 22:00 UTC keeps it clear of the
    # 21:00 clip slot and safely inside the same UTC day — see the gate below
    # for why crossing midnight UTC matters.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      day_override:
        description: 'Force day of week (0=Sun, 6=Sat). Leave empty for today.'
        required: false
      preview_only:
        description: 'Preview only (generate + render, do not post)'
        type: boolean
        default: false
      use_fallback:
        description: 'Skip the AI and use the static copy for the day'
        type: boolean
        default: false

permissions:
  issues: write
  contents: write

# The gate reads state that only gets committed at the END of a run, so two
# overlapping runs could both pass it and double-post. Serialize instead.
concurrency:
  group: website-ad
  cancel-in-progress: false

jobs:
  # Decides whether there is anything to do. Keeps the catch-up cron from
  # double-posting on days the 17:00 run already succeeded.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether today's ad already posted
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # 10# forces base 10; bash reads a bare "08"/"09" as invalid octal.
          HOUR=$((10#$(date -u +%H)))

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — always proceed"
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [ -f "content/ad-archive/$TODAY.json" ]; then
            echo "$TODAY ad already posted and archived — skipping"
            echo "should_run=false" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -lt 14 ]; then
            # ad.js reads BOTH the day-of-week rotation and the archive
            # filename off the runner's UTC clock. A run delayed past midnight
            # UTC would therefore post tomorrow's ad, file it under tomorrow's
            # date, and gate off tomorrow's legitimate 17:00 run — turning one
            # lost day into two. Bail out and let 17:00 handle it normally.
            echo "Delayed past midnight UTC (hour $HOUR) — skipping to avoid posting the wrong day's ad"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "No ad archived for $TODAY — proceeding"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  generate-and-post:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Facebook credentials are fatal; a missing AI key is not, because ad.js
      # falls back to static copy rather than skipping the day.
      - name: Validate secrets
        run: |
          MISSING=""
          if [ -z "${{ secrets.FACEBOOK_PAGE_TOKEN }}" ]; then MISSING="$MISSING FACEBOOK_PAGE_TOKEN"; fi
          if [ -z "${{ secrets.FACEBOOK_PAGE_ID }}" ]; then MISSING="$MISSING FACEBOOK_PAGE_ID"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi
          if [ -z "${{ secrets.GROQ_API_KEY }}" ] && [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "::warning::No AI provider key set -- the ad will post using static fallback copy."
          fi
          echo "Required secrets present"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: social-agent
        run: npm install

      - name: Generate and post website ad
        working-directory: social-agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.day_override }}" != "" ]; then
            ARGS="$ARGS --day ${{ github.event.inputs.day_override }}"
          fi
          if [ "${{ github.event.inputs.preview_only }}" = "true" ]; then
            ARGS="$ARGS --preview"
          fi
          if [ "${{ github.event.inputs.use_fallback }}" = "true" ]; then
            ARGS="$ARGS --fallback"
          fi
          node ad.js $ARGS

      # Always uploaded so the rendered ad can be reviewed even on a failed run.
      - name: Upload ad graphic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-ad
          path: social-agent/output/ad-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit ad archive
        if: ${{ github.event.inputs.preview_only != 'true' }}
        run: |
          git config user.name "IFM Ad Agent"
          git config user.email "ad-agent@increasingfaith.net"
          git add content/ad-archive/ || true
          if git diff --staged --quiet; then
            echo "No new ad archive to commit"
          else
            git commit -m "Website ad for $(date -u +%Y-%m-%d)"
            # The 22:00 catch-up sits an hour from the 21:00 clip slot, which
            # commits its own queue state, so the two can race for the ref.
            # Rebase onto whatever landed first, and retry in case it lands
            # mid-push. Same guard as social-media.yml and newsletter.yml.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "Push attempt $attempt lost the race — retrying in 5s"
              sleep 5
            done
            echo "::error::Could not push ad archive after 3 attempts"
            exit 1
          fi

      - name: Create failure alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Website Ad failed - ${date}`,
              body: [
                '## Daily Website Ad Failure',
                '',
                `**Date:** ${date}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'The daily website ad failed to generate or post.',
                'The rendered graphic (if any) is attached to the run as an artifact.',
                '',
                '*Auto-generated by IFM Ad Agent*'
              ].join('\n'),
              labels: ['social-media', 'automated'],
              assignees: ['pastorcurtis']
            });
