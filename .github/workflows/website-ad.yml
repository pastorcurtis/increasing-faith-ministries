name: Daily Website Ad

# Posts one Facebook ad per day whose only job is driving traffic to
# increasingfaith.net. Separate from "Daily Social Media" (the teaching post,
# 9 AM) and "Post IFM Clips" (9 AM + 4 PM) so the three do not collide.

on:
  schedule:
    # 12 PM EST / 1 PM EDT (5 PM UTC) every day — sits between the morning
    # teaching post and the afternoon clip.
    - cron: '0 17 * * *'
    # Catch-up passes. GitHub drops and delays scheduled runs under load: on
    # 2026-08-06 this workflow failed with "job was not acquired by Runner of
    # type hosted" and, having only one slot, lost the day outright. These
    # no-op if today's ad already posted, so extra slots cost nothing but a
    # gate job.
    #
    # Two of them, not one, because that incident took out three workflows
    # over a ~2.5h window and GitHub ran one slot 5.5h late the same day — a
    # single retry 5h out could land inside a long enough outage and miss too.
    #
    # Both sit clear of the neighbouring posters (social catch-up 19:00, clip
    # 21:00) and safely inside the same UTC day; see the gate below for why
    # crossing midnight UTC matters. 22:00 is the last slot that can run
    # without risking a post-midnight start.
    - cron: '30 19 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      day_override:
        description: 'Force day of week (0=Sun, 6=Sat). Leave empty for today.'
        required: false
      preview_only:
        description: 'Preview only (generate + render, do not post)'
        type: boolean
        default: false
      use_fallback:
        description: 'Skip the AI and use the static copy for the day'
        type: boolean
        default: false

permissions:
  issues: write
  contents: write

# The gate reads state that only gets committed at the END of a run, so two
# overlapping runs could both pass it and double-post. Serialize instead.
concurrency:
  group: website-ad
  cancel-in-progress: false

jobs:
  # Decides whether there is anything to do. Keeps the catch-up cron from
  # double-posting on days the 17:00 run already succeeded.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      # The day the ad is FOR. Not always today: a run delayed past midnight
      # UTC makes up the day it missed rather than skipping it.
      target: ${{ steps.check.outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether today's ad already posted
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d 'yesterday' +%Y-%m-%d)
          # 10# forces base 10; bash reads a bare "08"/"09" as invalid octal.
          HOUR=$((10#$(date -u +%H)))

          # A missing jq would make posted() answer "no" for every date, and
          # the gate would post on a day that already went out -- a duplicate
          # ad on the Page. A check that cannot run must be an ERROR, never an
          # implicit no. (Same shape as the orphan-check regex that silently
          # never matched: absence of a match is not evidence of absence.)
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq not found -- cannot distinguish a posted day from a failed one. Refusing to post."
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # ad.js writes an archive entry even when the POST fails, so testing
          # -f only proves a run happened -- the same "existence is not
          # success" trap that let a failed 14:00 social run tell its own
          # catch-up the day was already done. Ask whether Facebook took it.
          posted() {
            [ -f "content/ad-archive/$1.json" ] &&               jq -e '.postingResult.success == true' "content/ad-archive/$1.json" >/dev/null 2>&1
          }

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run -- proceeding for $TODAY"
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "target=$TODAY" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -ge 14 ]; then
            # Normal in-window path.
            if posted "$TODAY"; then
              echo "$TODAY ad already posted and archived -- skipping"
              echo "should_run=false" >> $GITHUB_OUTPUT
            else
              echo "No successful ad archived for $TODAY -- proceeding"
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "target=$TODAY" >> $GITHUB_OUTPUT
            fi
          elif [ "$HOUR" -ge 12 ]; then
            # Recovery is allowed only EARLY. Past 12:00 UTC a make-up post
            # would land within ~5h of today's own 17:00 slot and the Page
            # would get two ads nearly back to back.
            echo "Hour $HOUR is too close to today's 17:00 slot to make up $YESTERDAY -- skipping"
            echo "should_run=false" >> $GITHUB_OUTPUT
          elif posted "$YESTERDAY"; then
            echo "$YESTERDAY already posted -- nothing to recover"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            # Delayed past midnight UTC. This used to refuse outright, which
            # was correct but terminal: on 2026-08-27 and -28 GitHub dropped
            # every in-window slot, the only runs that landed were after
            # midnight, and both days went unposted behind green checks.
            #
            # ad.js now takes an explicit --date, so the rotation and the
            # archive key both follow the MISSED day. Today's 17:00 slot is
            # untouched. Only ever ONE day back -- a two-day-old traffic ad
            # is not worth a post.
            echo "Recovering missed ad for $YESTERDAY (hour $HOUR)"
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "target=$YESTERDAY" >> $GITHUB_OUTPUT
          fi

  generate-and-post:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Facebook credentials are fatal; a missing AI key is not, because ad.js
      # falls back to static copy rather than skipping the day.
      - name: Validate secrets
        run: |
          MISSING=""
          if [ -z "${{ secrets.FACEBOOK_PAGE_TOKEN }}" ]; then MISSING="$MISSING FACEBOOK_PAGE_TOKEN"; fi
          if [ -z "${{ secrets.FACEBOOK_PAGE_ID }}" ]; then MISSING="$MISSING FACEBOOK_PAGE_ID"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi
          if [ -z "${{ secrets.GROQ_API_KEY }}" ] && [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "::warning::No AI provider key set -- the ad will post using static fallback copy."
          fi
          echo "Required secrets present"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: social-agent
        run: npm install

      - name: Generate and post website ad
        working-directory: social-agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.day_override }}" != "" ]; then
            ARGS="$ARGS --day ${{ github.event.inputs.day_override }}"
          fi
          if [ "${{ github.event.inputs.preview_only }}" = "true" ]; then
            ARGS="$ARGS --preview"
          fi
          if [ "${{ github.event.inputs.use_fallback }}" = "true" ]; then
            ARGS="$ARGS --fallback"
          fi
          # Always explicit: the posting job must never re-derive the day
          # from its own clock, which is the coupling this whole change removes.
          ARGS="$ARGS --date ${{ needs.gate.outputs.target }}"
          node ad.js $ARGS

      # Always uploaded so the rendered ad can be reviewed even on a failed run.
      - name: Upload ad graphic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-ad
          path: social-agent/output/ad-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit ad archive
        if: ${{ github.event.inputs.preview_only != 'true' }}
        run: |
          git config user.name "IFM Ad Agent"
          git config user.email "ad-agent@increasingfaith.net"
          git add content/ad-archive/ || true
          if git diff --staged --quiet; then
            echo "No new ad archive to commit"
          else
            git commit -m "Website ad for $(date -u +%Y-%m-%d)"
            # The 22:00 catch-up sits an hour from the 21:00 clip slot, which
            # commits its own queue state, so the two can race for the ref.
            # Rebase onto whatever landed first, and retry in case it lands
            # mid-push. Same guard as social-media.yml and newsletter.yml.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "Push attempt $attempt lost the race — retrying in 5s"
              sleep 5
            done
            echo "::error::Could not push ad archive after 3 attempts"
            exit 1
          fi

      - name: Create failure alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Website Ad failed - ${date}`,
              body: [
                '## Daily Website Ad Failure',
                '',
                `**Date:** ${date}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'The daily website ad failed to generate or post.',
                'The rendered graphic (if any) is attached to the run as an artifact.',
                '',
                '*Auto-generated by IFM Ad Agent*'
              ].join('\n'),
              labels: ['social-media', 'automated'],
              assignees: ['pastorcurtis']
            });
