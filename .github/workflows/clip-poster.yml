name: Post IFM Clips
# Posts sermon clips from the cloud queue to Facebook

on:
  schedule:
    # 2 posts per day: 9AM, 4PM EST (14:00, 21:00 UTC)
    - cron: '0 14 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Dry run (no actual post)'
        type: boolean
        default: false
      test_alert:
        description: 'Send a [TEST] queue alert email (pair with test_mode to avoid posting)'
        type: boolean
        default: false

permissions:
  contents: write

# Prevent overlapping runs from posting the same clip twice
concurrency:
  group: clip-poster
  cancel-in-progress: false

jobs:
  post-clip:
    runs-on: ubuntu-latest
    # Video uploads to the Graph API retry with backoff; without a cap a hung
    # upload would sit against GitHub's 6-hour default while holding the
    # clip-poster concurrency group, blocking the next slot too.
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.FACEBOOK_PAGE_TOKEN }}" ]; then
            echo "ERROR: FACEBOOK_PAGE_TOKEN not set"
            exit 1
          fi
          if [ -z "${{ secrets.FACEBOOK_PAGE_ID }}" ]; then
            echo "ERROR: FACEBOOK_PAGE_ID not set"
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name "IFM Clip Bot"
          git config user.email "bot@increasingfaith.net"

      - name: Find next clip to post
        id: find-clip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          QUEUE_FILE="clips/cloud/queue.json"
          if [ ! -f "$QUEUE_FILE" ]; then
            echo "No queue file found. Push clips first."
            echo "has_clip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # How many clips are left BEFORE this run posts. The alert step
          # below reads it, because a green run is not proof a clip went out.
          REMAINING=$(python3 -c "
          import json
          with open('$QUEUE_FILE') as f:
              queue = json.load(f)
          print(sum(1 for c in queue['clips'] if not c.get('posted', False)))
          ")
          echo "remaining=$REMAINING" >> $GITHUB_OUTPUT

          # Find next unposted clip
          NEXT_CLIP=$(python3 -c "
          import json
          with open('$QUEUE_FILE') as f:
              queue = json.load(f)
          for clip in queue['clips']:
              if not clip.get('posted', False):
                  print(clip['file'])
                  break
          else:
              print('')
          ")

          if [ -z "$NEXT_CLIP" ]; then
            echo "All clips have been posted! Queue is empty."
            echo "has_clip=false" >> $GITHUB_OUTPUT
            echo "queue_empty=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Clips live as assets on the 'clip-queue' release, NOT in git.
          # Committing them bloated the repo permanently: every posted-and-
          # deleted clip stayed in history forever (906 MB by 2026-08-04).
          # Release assets never enter history, so the queue can turn over
          # indefinitely at a flat repo size. queue.json stays in git as the
          # state file, since it is small and must be committed per post.
          mkdir -p /tmp/clip
          if ! gh release download clip-queue \
                 --repo "$GITHUB_REPOSITORY" \
                 --pattern "$NEXT_CLIP" \
                 --dir /tmp/clip --clobber; then
            echo "ERROR: clip asset not found on clip-queue release: $NEXT_CLIP"
            echo "The queue lists a clip that was never uploaded, or the asset"
            echo "was deleted. Run auto-refill locally to repopulate."
            echo "has_clip=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          CLIP_PATH="/tmp/clip/$NEXT_CLIP"
          if [ ! -f "$CLIP_PATH" ]; then
            echo "ERROR: download reported success but file is missing: $CLIP_PATH"
            echo "has_clip=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$CLIP_PATH" 2>/dev/null || stat -f%z "$CLIP_PATH")
          FILE_MB=$(echo "scale=1; $FILE_SIZE / 1048576" | bc)

          echo "Next clip: $NEXT_CLIP ($FILE_MB MB)"
          echo "has_clip=true" >> $GITHUB_OUTPUT
          echo "clip_file=$NEXT_CLIP" >> $GITHUB_OUTPUT
          echo "clip_path=$CLIP_PATH" >> $GITHUB_OUTPUT

      - name: Post to Facebook
        if: steps.find-clip.outputs.has_clip == 'true' && inputs.test_mode != true
        id: post
        run: |
          CLIP_PATH="${{ steps.find-clip.outputs.clip_path }}"

          # Rotating engagement captions — different hook each post
          CAPTIONS=(
            "This word right here. Who needed to hear this today?"
            "Watch this and tell me it did not shift something in you."
            "If this spoke to your spirit, share it with someone who needs it."
            "Real Kingdom teaching. Drop an AMEN if you receive this."
            "This is the word for somebody today. Tag them below."
            "Stop scrolling. This is for you. What stood out?"
            "Most people will scroll past this. Kingdom citizens will not."
            "How many of you have been believing the wrong thing about this?"
            "Listen to this twice. Then tell me what the Spirit revealed to you."
            "This changes everything once you understand it. Agree or disagree?"
            "Somebody in your circle needs this word today. Share it."
            "This is not church as usual. This is Kingdom."
            "Play this for someone who thinks they know the Bible."
            "The truth cuts deep, but it sets you free. Who felt that?"
            "I challenge you to listen to this and not be changed."
          )
          # Pick a caption based on current hour + minute for variety
          INDEX=$(( ($(date +%s) / 60) % ${#CAPTIONS[@]} ))
          HOOK="${CAPTIONS[$INDEX]}"

          CAPTION=$(printf '%s\n\nWatch Hour of Power LIVE Mon-Fri 8:15 AM\nincreasingfaith.net\n\n#HourOfPower #KingdomOfGod #IncreasingFaith #IFM #KingdomLiving #PastorCurtis' "$HOOK")

          echo "Posting ${{ steps.find-clip.outputs.clip_file }} to Facebook..."
          echo "Caption hook: $HOOK"

          # Retry up to 3 times — Facebook Graph occasionally returns transient
          # "error code 1" (API Unknown) on video uploads; a short backoff usually clears it.
          MAX_ATTEMPTS=3
          ATTEMPT=1
          SUCCESS=false
          ERROR=""
          RESPONSE=""
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Upload attempt $ATTEMPT of $MAX_ATTEMPTS..."
            RESPONSE=$(curl -s \
              -X POST \
              "https://graph.facebook.com/v21.0/${{ secrets.FACEBOOK_PAGE_ID }}/videos" \
              -F "access_token=${{ secrets.FACEBOOK_PAGE_TOKEN }}" \
              -F "description=$CAPTION" \
              -F "source=@$CLIP_PATH")

            echo "Response: $RESPONSE"

            # Treat empty/non-JSON responses as retryable failures
            ERROR=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('error',{}).get('message',''))" 2>/dev/null || echo "Invalid or empty response from Facebook")

            if [ -z "$ERROR" ]; then
              SUCCESS=true
              break
            fi

            echo "Attempt $ATTEMPT failed: $ERROR"
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Waiting 30s before retry..."
              sleep 30
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "ERROR: All $MAX_ATTEMPTS attempts failed. Last error: $ERROR"
            exit 1
          fi

          VIDEO_ID=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id','') or d.get('video_id',''))" 2>/dev/null)
          echo "Posted! Video ID: $VIDEO_ID"
          echo "video_id=$VIDEO_ID" >> $GITHUB_OUTPUT

      - name: Update queue and push
        if: steps.find-clip.outputs.has_clip == 'true' && inputs.test_mode != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Update queue.json to mark clip as posted
          python3 -c "
          import json
          from datetime import datetime, timezone

          QUEUE_FILE = 'clips/cloud/queue.json'
          clip_file = '${{ steps.find-clip.outputs.clip_file }}'
          video_id = '${{ steps.post.outputs.video_id }}'

          with open(QUEUE_FILE) as f:
              queue = json.load(f)

          for clip in queue['clips']:
              if clip['file'] == clip_file:
                  clip['posted'] = True
                  clip['video_id'] = video_id
                  clip['posted_at'] = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
                  break

          # Update stats
          posted = sum(1 for c in queue['clips'] if c.get('posted'))
          total = len(queue['clips'])
          queue['stats'] = {
              'total': total,
              'posted': posted,
              'remaining': total - posted,
              'last_updated': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          }

          with open(QUEUE_FILE, 'w') as f:
              json.dump(queue, f, indent=2)
          "

          CLIP_NAME="${{ steps.find-clip.outputs.clip_file }}"

          # Drop the posted clip from the release so the queue does not grow
          # without bound. Deliberately non-fatal: the post already succeeded,
          # and failing here would mark the clip unposted and repost it next
          # run. A stray asset is harmless; a duplicate Facebook post is not.
          if ! gh release delete-asset clip-queue "$CLIP_NAME" \
                 --repo "$GITHUB_REPOSITORY" --yes; then
            echo "WARNING: could not delete asset $CLIP_NAME from clip-queue."
            echo "The post succeeded. Remove the asset manually when convenient."
          fi

          # Stage and commit changes FIRST (before pulling).
          # Only queue.json now — clip binaries no longer live in git.
          git add clips/cloud/queue.json
          git commit -m "Posted clip: ${CLIP_NAME}" || echo "Nothing to commit"

          # Pull with rebase to incorporate any changes, then push
          # Now safe because our changes are committed
          git pull --rebase origin main
          git push

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.find-clip.outputs.has_clip }}" != "true" ]; then
            echo "No clips to post. Push more clips to refill the queue."
          elif [ "${{ inputs.test_mode }}" == "true" ]; then
            echo "TEST MODE - would have posted: ${{ steps.find-clip.outputs.clip_file }}"
          else
            echo "Posted: ${{ steps.find-clip.outputs.clip_file }}"
            echo "Video ID: ${{ steps.post.outputs.video_id }}"
            # Show remaining
            python3 -c "
          import json
          with open('clips/cloud/queue.json') as f:
              q = json.load(f)
          remaining = sum(1 for c in q['clips'] if not c.get('posted'))
          print(f'Queue: {remaining} clips remaining')
          " 2>/dev/null || true
          fi

      # Deliver the queue alarm to a human. From 2026-09-17 the queue sat empty
      # for 5 slots while every run concluded green ("Queue is empty" exits 0).
      # The weekly refill had been under-producing since mid-August, draining a
      # 59-clip buffer, and nothing noticed. So this warns while there is still
      # time to refill, not only after posts are lost.
      #
      # Only the first cron slot of the day emails, so a known-low queue sends
      # one message a day, not two. An alert you learn to ignore is worse than
      # none. continue-on-error: failing to deliver the alarm must never mask
      # the problem it is about.
      - name: Email the clip-queue alarm
        if: >-
          always() && steps.find-clip.outputs.remaining != '' &&
          (inputs.test_alert == true ||
           (inputs.test_mode != true &&
            (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 14 * * *')))
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMAINING: ${{ steps.find-clip.outputs.remaining }}
          POST_OUTCOME: ${{ steps.post.outcome }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          # Warn at 3 days (2 posts/day) or fewer left after this run.
          LOW_WATER=6
          LEFT=$REMAINING
          if [ "$POST_OUTCOME" = "success" ]; then LEFT=$((REMAINING - 1)); fi

          if [ "$TEST_ALERT" != "true" ] && [ "$LEFT" -gt "$LOW_WATER" ]; then
            echo "Queue healthy: $LEFT clips left (warns at $LOW_WATER or fewer)."
            exit 0
          fi

          PREFIX=""
          if [ "$TEST_ALERT" = "true" ]; then PREFIX="[TEST] "; fi

          if [ "$REMAINING" -eq 0 ]; then
            SUBJECT="${PREFIX}IFM: clip queue EMPTY - no Facebook clip posted"
            HEADLINE="The Facebook clip queue is EMPTY. No sermon clip was posted this slot, and none will post until the queue is refilled."
          else
            SUBJECT="${PREFIX}IFM: clip queue LOW - $LEFT clips left (~$((LEFT / 2)) days)"
            HEADLINE="The Facebook clip queue is running low: $LEFT clips left, about $((LEFT / 2)) days at 2 posts a day."
          fi

          cat > /tmp/clip-alert.md <<ALERTEOF
          $HEADLINE

          To refill now (laptop plugged in and awake), in PowerShell:
            Start-ScheduledTask -TaskName "IFM Weekly Clip Refill"

          The refill runs Sunday 6:00 AM on the laptop. If the laptop is off or
          asleep then, no clips get made that week. That is what emptied the
          queue in September 2026: the refill missed two Sundays and came up
          short on a third. Check clips/auto-refill.log in IFM-Assets/clip-exports.
          ALERTEOF
          node .github/scripts/send-alert.js \
            --subject "$SUBJECT" \
            --body-file /tmp/clip-alert.md \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Tell the truth in the Actions tab: a slot with nothing to post is a
      # missed post, not a success. Runs last, after the alarm has gone out.
      - name: Fail the run if the queue was empty
        if: steps.find-clip.outputs.queue_empty == 'true' && inputs.test_mode != true
        run: |
          echo "::error::Clip queue is empty - no clip was posted. Run the IFM Weekly Clip Refill."
          exit 1
