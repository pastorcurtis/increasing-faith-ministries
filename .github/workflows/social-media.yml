name: Daily Social Media

on:
  schedule:
    # 9 AM EST (2 PM UTC) every day
    - cron: '0 14 * * *'
    # Catch-up pass. GitHub silently drops scheduled runs under load (it
    # skipped 2026-08-04 entirely, so no post went out that day). This run
    # no-ops if today's archive entry already exists.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      day_override:
        description: 'Force day of week (0=Sun, 6=Sat). Leave empty for today.'
        required: false
      preview_only:
        description: 'Preview only (do not post)'
        type: boolean
        default: false

permissions:
  issues: write
  contents: write

jobs:
  # Decides whether there is anything to do. Keeps the catch-up cron from
  # double-posting on days the 14:00 run already succeeded.
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether today already posted
        id: check
        run: |
          TODAY=$(date +%Y-%m-%d)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — always proceed"
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [ ! -f "content/social-posts/$TODAY.json" ]; then
            echo "No archive entry for $TODAY — proceeding"
            echo "should_run=true" >> $GITHUB_OUTPUT
          # File existence alone is NOT proof a post went out. A run whose
          # content generation fails still writes an archive entry, but one
          # holding only {"error": ...} per platform. The old check tested
          # `-f` and nothing more, so every failed 14:00 run left behind a
          # file that told the 19:00 catch-up "already done" -- converting a
          # recoverable one-day miss into an unbounded silent outage. That is
          # exactly what happened 2026-08-17..24: Groq retired the Llama chat
          # models, all 8 mornings failed, and all 8 catch-ups skipped.
          #
          # Facebook is the only platform this workflow actually posts to, so
          # its generated copy is the thing that decides "already posted".
          elif jq -e '.posts.facebook.content | strings | select(length > 0)'                  "content/social-posts/$TODAY.json" >/dev/null 2>&1; then
            echo "$TODAY already generated and posted — skipping"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "::warning::Archive entry for $TODAY exists but holds no Facebook copy (failed run) — retrying."
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  generate-and-post:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Raised from 10: rate-limit backoff can now legitimately wait out Groq's
    # 60s token window several times over before giving up.
    timeout-minutes: 20

    steps:
      # -- Validate secrets early --
      - name: Validate secrets
        run: |
          MISSING=""
          if [ -z "${{ secrets.GROQ_API_KEY }}" ]; then MISSING="$MISSING GROQ_API_KEY"; fi
          if [ -z "${{ secrets.FACEBOOK_PAGE_TOKEN }}" ]; then MISSING="$MISSING FACEBOOK_PAGE_TOKEN"; fi
          if [ -z "${{ secrets.FACEBOOK_PAGE_ID }}" ]; then MISSING="$MISSING FACEBOOK_PAGE_ID"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi
          echo "All required secrets present"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: social-agent
        run: npm install

      # -- Generate content --
      - name: Generate social media content
        id: generate
        working-directory: social-agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional fallback provider; agent runs Groq-only if this is unset.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.day_override }}" != "" ]; then
            ARGS="$ARGS --day ${{ github.event.inputs.day_override }}"
          fi
          if [ "${{ github.event.inputs.preview_only }}" = "true" ]; then
            ARGS="$ARGS --preview"
          fi
          node index.js $ARGS

      # -- Upload generated graphic as artifact (always, for visual review) --
      - name: Upload preview graphic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-graphic
          path: social-agent/output/*.png
          if-no-files-found: ignore
          retention-days: 7

      # -- Post to Facebook --
      - name: Post to Facebook
        id: post
        if: ${{ github.event.inputs.preview_only != 'true' }}
        working-directory: social-agent
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: node poster.js

      # -- Commit generated content to archive --
      - name: Commit social content archive
        id: commit
        if: ${{ github.event.inputs.preview_only != 'true' }}
        run: |
          git config user.name "IFM Social Agent"
          git config user.email "social-agent@increasingfaith.net"
          git add content/social-posts/ content/social-archive/ || true
          if git diff --staged --quiet; then
            echo "No new content to commit"
          else
            DATE=$(date +%Y-%m-%d)
            git commit -m "Social media content for $DATE"
            # Clip Poster fires on the same 14:00 UTC cron and commits its queue
            # state, so both jobs regularly race for the same ref. Rebase onto
            # whatever landed first, and retry in case it lands mid-push.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "Push attempt $attempt lost the race — retrying in 5s"
              sleep 5
            done
            echo "::error::Could not push social archive after 3 attempts"
            exit 1
          fi

      # -- Report partial generation failures --
      # Runs last on purpose: posting and archiving have already happened, so
      # one dead platform never costs us the Facebook post — but the run still
      # goes red instead of hiding a missing platform behind a green check.
      - name: Fail if any platform did not generate
        if: ${{ steps.generate.outputs.failed_platforms != '' }}
        run: |
          echo "::error::Content generation failed for: ${{ steps.generate.outputs.failed_platforms }}"
          exit 1

      # -- Alert on failure --
      - name: Create failure alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Social Media Agent failed - ${date}`,
              body: [
                '## Social Media Pipeline Failure',
                '',
                `**Date:** ${date}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '| Step | Result |',
                '| --- | --- |',
                `| Generate content | ${{ toJSON(steps.generate.outcome) }} |`,
                `| Post to Facebook | ${{ toJSON(steps.post.outcome) }} |`,
                `| Commit archive | ${{ toJSON(steps.commit.outcome) }} |`,
                '',
                `**Platforms that failed to generate:** ${{ toJSON(steps.generate.outputs.failed_platforms) }} (empty = all generated)`,
                '',
                '> A failure here does NOT necessarily mean nothing was posted.',
                '> If "Post to Facebook" succeeded, the post went out and the',
                '> failure was downstream (archive commit or a dead platform).',
                '> Check the Facebook page before regenerating anything.',
                '',
                '*Auto-generated by Social Media Agent*'
              ].join('\n'),
              labels: ['social-media', 'automated']
            });
