# =============================================================================
# IFM System Diagnostics (Self-Healing)
# =============================================================================
#
# Runs every 3 days to check the health of ALL IFM automation systems.
# Automatically fixes issues it can resolve. Creates a GitHub Issue for
# anything that requires manual intervention.
#
# Checks performed:
#   1. All workflows are enabled (re-enables if disabled)
#   2. Clip queue has enough content (warns when low)
#   3. Clip poster workflow is actually posting (detects stalls)
#   4. Facebook API token is valid (detects expired tokens)
#   5. Website pages return 200
#   6. Newsletter system is healthy
#   7. Required secrets are configured
#   8. Node.js dependencies install cleanly
#   9. A daily post actually landed each day (archive files, not exit codes --
#      a gate job can skip the poster and still conclude "success")
#
# Auto-fixes:
#   - Re-enables disabled workflows
#   - Re-enables disabled clip poster on stall detection
#
# =============================================================================
name: System Diagnostics

on:
  schedule:
    # Every 3 days at 7:00 AM EST (12:00 UTC)
    - cron: '0 12 */3 * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test alert email to prove the alarm path works, then continue normally'
        type: boolean
        default: false

permissions:
  issues: write
  actions: write
  # write (not read): the run persists problem-age state to
  # .github/diagnostics-state.json so alert duration survives across runs.
  contents: write

jobs:
  diagnose:
    name: System Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NETLIFY_ACCESS_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # An alarm you have never tested is a guess. The August outage was
      # 8 days of alerts that fired correctly and reached nobody, so the
      # delivery path deserves the same scepticism as the checks themselves.
      # Run this workflow from the Actions tab with test_alert ticked to prove
      # email still works, without waiting for something to break.
      - name: Send test alert
        if: inputs.test_alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cat > /tmp/test-alert.md <<ALERTEOF
          This is a test of the IFM automation alarm path, triggered by hand.

          Nothing is wrong. This email proves that when something DOES break,
          the alert can actually reach you -- rather than filing a GitHub issue
          nobody reads, which is what happened for 8 days in August.

          Alerts you will get automatically from now on:
            - Daily social post failed
            - Daily website ad did not post
            - Daily website ad posted with canned fallback copy
            - Diagnostics found a NEW problem (checked every 3 days)
          ALERTEOF
          node .github/scripts/send-alert.js \
            --subject "IFM: alert path test - nothing is wrong" \
            --body-file /tmp/test-alert.md \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ================================================================
      # CHECK 1: Verify all workflows are enabled
      # ================================================================
      - name: Check workflow status
        id: workflows
        uses: actions/github-script@v7
        with:
          script: |
            const results = [];
            // Map display name -> filename fallback (GitHub sometimes caches the path as the name)
            const requiredWorkflows = [
              { name: 'Monthly Newsletter', file: 'newsletter.yml' },
              { name: 'Keep Alive', file: 'keepalive.yml' },
              { name: 'Post IFM Clips', file: 'clip-poster.yml' },
              { name: 'Daily Social Media', file: 'social-media.yml' }
            ];

            const { data: workflows } = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            for (const { name, file } of requiredWorkflows) {
              // Search by name first, then fall back to matching the filename in the path
              const wf = workflows.workflows.find(w => w.name === name)
                || workflows.workflows.find(w => w.path && w.path.endsWith(file));
              if (!wf) {
                results.push({ name, status: 'MISSING', fixed: false });
                continue;
              }
              if (wf.state !== 'active') {
                try {
                  await github.rest.actions.enableWorkflow({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: wf.id
                  });
                  results.push({ name, status: 'RE-ENABLED', fixed: true });
                  core.warning(`${name} workflow was disabled -- automatically re-enabled`);
                } catch (e) {
                  results.push({ name, status: 'DISABLED', fixed: false, error: e.message });
                }
              } else {
                results.push({ name, status: 'OK', fixed: false });
              }
            }

            core.setOutput('results', JSON.stringify(results));

      # ================================================================
      # CHECK 2: Clip queue health
      # ================================================================
      - name: Check clip queue
        id: clip_queue
        run: |
          QUEUE_FILE="clips/cloud/queue.json"
          if [ ! -f "$QUEUE_FILE" ]; then
            echo "status=missing" >> $GITHUB_OUTPUT
            echo "remaining=0" >> $GITHUB_OUTPUT
            echo "days_left=0" >> $GITHUB_OUTPUT
            echo "::error::Clip queue file missing!"
            exit 0
          fi

          REMAINING=$(python3 -c "
          import json
          with open('$QUEUE_FILE') as f:
              q = json.load(f)
          remaining = sum(1 for c in q['clips'] if not c.get('posted'))
          print(remaining)
          " 2>/dev/null || echo "0")

          DAYS_LEFT=$(python3 -c "print(int('$REMAINING') // 2)" 2>/dev/null || echo "0")

          echo "remaining=$REMAINING" >> $GITHUB_OUTPUT
          echo "days_left=$DAYS_LEFT" >> $GITHUB_OUTPUT

          # Age of the last ACTUAL post. Catches the inverse failure of an empty
          # queue: clips available, workflow green, but nothing going out.
          # stats.last_updated is rewritten by clip-poster on every real post.
          STALE_DAYS=$(python3 -c "
          import json
          from datetime import datetime, timezone
          try:
              with open('$QUEUE_FILE') as f:
                  q = json.load(f)
              ts = q.get('stats', {}).get('last_updated')
              d = datetime.strptime(ts, '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=timezone.utc)
              print((datetime.now(timezone.utc) - d).days)
          except Exception:
              print(-1)
          " 2>/dev/null || echo "-1")

          echo "stale_days=$STALE_DAYS" >> $GITHUB_OUTPUT
          if [ "$STALE_DAYS" -ge 3 ] && [ "$REMAINING" != "0" ]; then
            echo "::error::No clip has posted in $STALE_DAYS days despite $REMAINING clips in queue."
          fi

          if [ "$REMAINING" = "0" ]; then
            echo "status=empty" >> $GITHUB_OUTPUT
            echo "::error::Clip queue is EMPTY! Facebook posting has stopped."
          elif [ "$DAYS_LEFT" -le 3 ]; then
            echo "status=critical" >> $GITHUB_OUTPUT
            echo "::warning::Clip queue critically low: $REMAINING clips ($DAYS_LEFT days)"
          elif [ "$DAYS_LEFT" -le 7 ]; then
            echo "status=low" >> $GITHUB_OUTPUT
            echo "::warning::Clip queue running low: $REMAINING clips ($DAYS_LEFT days)"
          else
            echo "status=ok" >> $GITHUB_OUTPUT
            echo "Queue healthy: $REMAINING clips ($DAYS_LEFT days)"
          fi

      # ================================================================
      # CHECK 3: Per-workflow scheduled-run health
      # ================================================================
      # Watches each scheduled workflow for the failure modes that bit us
      # 2026-04-05 → 2026-05-04 (clip-poster silent for 9 days):
      #   - Schedule throttled by GitHub after repeated failures (state stays "active")
      #   - YAML startup_failure (jobs.total_count === 0, no logs)
      #   - Last *successful scheduled* run too old (any other recent run masks it)
      - name: Check scheduled workflow health
        id: sched_health
        uses: actions/github-script@v7
        with:
          script: |
            // Workflows that MUST fire on schedule. stale_hours = max gap before alert.
            //
            // Calibrating stale_hours: it must exceed the LARGEST *natural* gap
            // between scheduled runs, plus headroom for GitHub's cron delay.
            // GitHub Actions cron is best-effort; runs here land 1h-2.5h late
            // routinely. Set it too tight and every healthy night trips the alarm.
            //
            //   clip-poster.yml   crons 14:00 + 21:00 UTC
            //                     -> gaps are 7h (day) and 17h (overnight)
            //                     -> 17h natural + ~2.5h delay = ~19.5h real max
            //                     -> 26h leaves margin and still catches a dead cron
            //                        within about a day. (Was 14h, which is BELOW the
            //                        normal 17h overnight gap, so it false-alarmed
            //                        every time diagnostics ran before the 14:00 post
            //                        landed. Fixed 2026-08-04, see issue #51.)
            //
            //   social-media.yml  crons 14:00 + 19:00 UTC (catch-up added 2026-08-05)
            //                     -> gaps are 5h (day) and 19h (overnight)
            //                     -> 30h. Tempting to tighten now that the catch-up
            //                        shrank the natural gap, but DON'T: on 2026-08-06
            //                        GitHub ran the 19:00 slot 5.5h late, which alone
            //                        eats 24.5h. Keep the headroom.
            //
            //   website-ad.yml    crons 17:00 + 22:00 UTC (catch-up added 2026-08-06)
            //                     -> same shape as social-media, so same 30h.
            //                     -> Was ABSENT from this list entirely. On 2026-08-06
            //                        all three posting workflows died on GitHub's
            //                        "job was not acquired by Runner" incident; the
            //                        other two self-healed, the ad lost the day, and
            //                        nothing alerted because nothing was watching it.
            //
            // NOTE: this check is only a coarse LIVENESS probe — it proves a run
            // happened, not that a post went out. Now that these workflows have gate
            // jobs that can legitimately skip the posting job, a run can conclude
            // "success" having posted nothing. The archive-gap check below is the
            // one that catches a genuinely missed day.
            const targets = [
              { name: 'Post IFM Clips',     file: 'clip-poster.yml',  stale_hours: 26 },
              { name: 'Daily Social Media', file: 'social-media.yml', stale_hours: 30 },
              { name: 'Daily Website Ad',   file: 'website-ad.yml',   stale_hours: 30 }
            ];

            const { data: workflows } = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const findWf = (t) => workflows.workflows.find(w => w.name === t.name)
              || workflows.workflows.find(w => w.path && w.path.endsWith(t.file));

            const results = [];

            for (const target of targets) {
              const wf = findWf(target);
              if (!wf) {
                results.push({ name: target.name, file: target.file, status: 'missing' });
                continue;
              }

              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf.id,
                per_page: 10
              });

              if (runs.workflow_runs.length === 0) {
                results.push({ name: target.name, file: target.file, status: 'never_run' });
                continue;
              }

              const now = Date.now();
              const hoursSince = (run) =>
                Math.floor((now - new Date(run.created_at).getTime()) / 3600000);

              // Last *successful scheduled* run — the metric that actually matters.
              const lastSchedSuccess = runs.workflow_runs.find(
                r => r.event === 'schedule' && r.conclusion === 'success'
              );
              const lastSchedSuccessAge = lastSchedSuccess ? hoursSince(lastSchedSuccess) : null;

              // Startup failures (YAML rejected) — fingerprint: jobs.total_count === 0.
              // Only check the most recent few runs to limit API calls.
              let startupFailureCount = 0;
              for (const r of runs.workflow_runs.slice(0, 5)) {
                if (r.conclusion !== 'failure') continue;
                try {
                  const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: r.id
                  });
                  if (jobs.total_count === 0) startupFailureCount++;
                } catch (_) { /* ignore */ }
              }

              const recentFailures = runs.workflow_runs
                .slice(0, 5)
                .filter(r => r.conclusion === 'failure').length;

              // Collect all observed issues, then pick the *most specific* status.
              // Specificity ranking (most → least): startup_failure > no_scheduled_success
              // > schedule_stalled > failing > ok. The most specific diagnosis is the
              // most actionable, so it wins and drives the report's remediation hint.
              const issues = [];
              if (startupFailureCount > 0) {
                issues.push(`${startupFailureCount} startup_failure run(s) — workflow YAML did not parse`);
              }
              if (lastSchedSuccessAge === null) {
                issues.push('No successful scheduled run on record (last 10 runs)');
              } else if (lastSchedSuccessAge > target.stale_hours) {
                issues.push(`Last successful scheduled run was ${lastSchedSuccessAge}h ago (threshold ${target.stale_hours}h)`);
              }
              if (recentFailures >= 3) {
                issues.push(`${recentFailures} of last 5 runs failed`);
              }

              let status = 'ok';
              if (startupFailureCount > 0) status = 'startup_failure';
              else if (lastSchedSuccessAge === null) status = 'no_scheduled_success';
              else if (lastSchedSuccessAge > target.stale_hours) status = 'schedule_stalled';
              else if (recentFailures >= 3) status = 'failing';

              if (status !== 'ok') {
                core.warning(`${target.name}: ${issues.join('; ')}`);
              }

              results.push({
                name: target.name,
                file: target.file,
                state: wf.state,
                status,
                issues,
                last_sched_success_age_h: lastSchedSuccessAge,
                startup_failures: startupFailureCount,
                recent_failures: recentFailures,
                threshold_h: target.stale_hours
              });
            }

            core.setOutput('results', JSON.stringify(results));

      # ================================================================
      # CHECK 4: Facebook API token validity
      # ================================================================
      - name: Check Facebook token
        id: fb_token
        env:
          FB_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          if [ -z "$FB_TOKEN" ] || [ -z "$FB_PAGE_ID" ]; then
            echo "status=missing" >> $GITHUB_OUTPUT
            echo "::error::Facebook secrets not configured"
            exit 0
          fi

          # Test the token with a simple API call
          RESPONSE=$(curl -s "https://graph.facebook.com/v21.0/me?access_token=$FB_TOKEN" 2>/dev/null)
          ERROR=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('error',{}).get('message',''))" 2>/dev/null || echo "")

          if [ -n "$ERROR" ]; then
            echo "status=expired" >> $GITHUB_OUTPUT
            echo "::error::Facebook token is invalid: $ERROR"
          else
            NAME=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('name','unknown'))" 2>/dev/null || echo "unknown")
            echo "status=ok" >> $GITHUB_OUTPUT
            echo "Facebook token valid (page: $NAME)"
          fi

      # ================================================================
      # CHECK 5: Verify required secrets exist
      # ================================================================
      - name: Check secrets
        id: secrets
        run: |
          ISSUES=""
          if [ -z "$GROQ_API_KEY" ]; then ISSUES="$ISSUES GROQ_API_KEY"; fi
          if [ -z "$RESEND_API_KEY" ]; then ISSUES="$ISSUES RESEND_API_KEY"; fi
          if [ -z "$FACEBOOK_PAGE_TOKEN" ]; then ISSUES="$ISSUES FACEBOOK_PAGE_TOKEN"; fi
          if [ -z "$FACEBOOK_PAGE_ID" ]; then ISSUES="$ISSUES FACEBOOK_PAGE_ID"; fi
          if [ -n "$ISSUES" ]; then
            echo "missing=$ISSUES" >> $GITHUB_OUTPUT
            echo "::warning::Missing secrets:$ISSUES"
          else
            echo "missing=" >> $GITHUB_OUTPUT
            echo "All secrets configured."
          fi

      # ================================================================
      # CHECK 6: Validate newsletter content files
      # ================================================================
      - name: Validate content files
        id: content
        run: |
          ISSUES=""

          if [ ! -f "content/newsletters/latest.json" ]; then
            ISSUES="$ISSUES latest.json_missing"
          else
            node -e "
              const data = require('./content/newsletters/latest.json');
              const errors = [];
              if (!data.metadata) errors.push('missing metadata');
              if (!data.metadata?.dateString) errors.push('missing metadata.dateString');
              if (!data.metadata?.title) errors.push('missing metadata.title');
              if (!data.sections) errors.push('missing sections');
              if (errors.length > 0) {
                console.error('latest.json issues: ' + errors.join(', '));
                process.exit(1);
              }
              console.log('latest.json: valid (' + data.metadata.dateString + ')');
            " 2>&1 || ISSUES="$ISSUES latest.json_invalid"
          fi

          if [ ! -f "content/newsletters/archive.json" ]; then
            ISSUES="$ISSUES archive.json_missing"
          else
            node -e "
              const data = require('./content/newsletters/archive.json');
              if (!Array.isArray(data)) { process.exit(1); }
              console.log('archive.json: valid (' + data.length + ' entries)');
            " 2>&1 || ISSUES="$ISSUES archive.json_invalid"
          fi

          echo "issues=$ISSUES" >> $GITHUB_OUTPUT

      # ================================================================
      # CHECK 7: Test newsletter-agent dependencies
      # ================================================================
      - name: Test newsletter-agent install
        id: deps
        working-directory: newsletter-agent
        run: |
          npm install 2>&1 || echo "deps_failed=true" >> $GITHUB_OUTPUT
          echo "Dependencies installed successfully."

      # ================================================================
      # CHECK 8: Website accessibility
      # ================================================================
      - name: Check website pages
        id: website
        run: |
          ISSUES=""
          PAGES="index.html newsletter.html about.html teachings.html give.html"
          BASE="https://increasingfaith.net"

          for page in $PAGES; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$BASE/$page" 2>/dev/null || echo "timeout")
            if [ "$STATUS" = "200" ]; then
              echo "$page: OK (200)"
            else
              ISSUES="$ISSUES ${page}=${STATUS}"
              echo "::warning::$page returned $STATUS"
            fi
          done

          echo "issues=$ISSUES" >> $GITHUB_OUTPUT

      # ================================================================
      # CHECK 9: Last newsletter run
      # ================================================================
      - name: Check last newsletter run
        id: last_run
        uses: actions/github-script@v7
        with:
          script: |
            const { data: workflows } = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const nlWorkflow = workflows.workflows.find(w => w.name === 'Monthly Newsletter');
            if (!nlWorkflow) {
              core.setOutput('status', 'workflow_missing');
              return;
            }

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: nlWorkflow.id,
              per_page: 1
            });

            if (runs.workflow_runs.length === 0) {
              core.setOutput('status', 'never_run');
              return;
            }

            const lastRun = runs.workflow_runs[0];
            const daysSince = Math.floor(
              (Date.now() - new Date(lastRun.created_at).getTime()) / 86400000
            );
            core.setOutput('status', lastRun.conclusion || lastRun.status);
            core.setOutput('days_since', daysSince.toString());

            if (lastRun.conclusion === 'failure') {
              core.warning(`Last newsletter run FAILED on ${lastRun.created_at}`);
            }
            if (daysSince > 35) {
              core.warning(`Last newsletter was ${daysSince} days ago`);
            }

      # ================================================================
      # CHECK 10: Repository size
      # ================================================================
      # Clips are committed to git, so every posted-and-deleted clip stays in
      # history forever. As of 2026-08-04 the repo is ~906 MB, of which ~443 MB
      # is dead weight (176 blobs for clips already posted and removed from the
      # tree). It grows roughly 40 MB/month. GitHub recommends staying under
      # 1 GB and blocks pushes past 5 GB -- if that wall is ever hit, the Sunday
      # refill can no longer push and Facebook posting starves a month later.
      # This check makes an otherwise invisible, slow problem visible early.
      - name: Check repository size
        id: repo_size
        uses: actions/github-script@v7
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            // repo.size is in KB and reflects GitHub's server-side estimate.
            const sizeMb = Math.round(repo.size / 1024);
            core.setOutput('size_mb', sizeMb.toString());

            const WARN_MB = 1024;      // GitHub's recommended maximum
            const CRITICAL_MB = 2048;  // halfway to the 5 GB hard push limit

            let status = 'ok';
            if (sizeMb >= CRITICAL_MB) status = 'critical';
            else if (sizeMb >= WARN_MB) status = 'warn';
            core.setOutput('status', status);

            if (status !== 'ok') {
              core.warning(`Repository is ${sizeMb} MB (warn at ${WARN_MB} MB)`);
            }

      # ================================================================
      # CHECK 11: Daily post archives -- did a post actually happen?
      # ================================================================
      # Why this exists, and why CHECK 3 is not enough: CHECK 3 only asks
      # whether a workflow RAN and concluded "success". Both daily posters now
      # open with an idempotency gate job that decides whether today's post is
      # already done and, if so, skips the posting job entirely. The run still
      # concludes "success". A day with ZERO posts and a perfectly healthy day
      # are therefore indistinguishable from the run list -- green either way.
      #
      # So this check looks at the ARTIFACT instead of the exit status. Both
      # posters commit a <YYYY-MM-DD>.json into their archive directory as the
      # last act of a real post, so a missing file is proof nothing went out
      # that day, whatever the checkmarks say. Same lesson as the stale_days
      # probe in CHECK 2: trust what the job wrote, not that it exited 0.
      #
      # Calibration -- why ONE missing day is only a warning:
      # the real gaps we have observed were 2026-08-01 (run cancelled),
      # 2026-08-04 (GitHub silently dropped the schedule), 2026-08-05 (run
      # failed) and 2026-08-06 (GitHub's "job was not acquired by Runner"
      # incident). Isolated days are lost to infrastructure we do not control
      # and the next cron self-heals. Escalating every one of those to a
      # Problem would train everyone to scroll past this alarm -- exactly the
      # habit the persistence tracking further down exists to break. TWO OR
      # MORE misses inside a 7-day window is no longer bad luck; that is a
      # broken poster, and it escalates.
      #
      # Today is excluded from the window on purpose: the primary crons are
      # 17:00 UTC (website ad) and 14:00 UTC (social), so for most of the day
      # today's file is legitimately absent and would be a guaranteed false
      # positive.
      #
      # The window is ALSO floored, per directory, at that directory's earliest
      # existing entry. A date before a feature existed is not a missed post.
      # The Daily Website Ad only shipped 2026-08-03, so an unfloored 7-day
      # lookback would have reported 2026-07-31..08-03 as missed ads on this
      # check's very first run -- a false alarm out of the gate, which is the
      # exact regression the issue #51 note in CHECK 3 above warns about.
      # The two directories are floored independently because social-posts has
      # months of history while ad-archive has days.
      - name: Check daily post archives
        id: daily_posts
        run: |
          python3 << 'PYEOF'
          import os, re
          from datetime import datetime, timedelta, timezone

          WINDOW_DAYS = 7   # complete UTC days to look back over (today excluded)
          ESCALATE_AT = 2   # misses inside the window that turn warning -> problem

          ARCHIVE_FILE = re.compile(r'^(\d{4}-\d{2}-\d{2})\.json$')

          today = datetime.now(timezone.utc).date()
          # ISO date strings sort and compare identically to real dates, so the
          # whole comparison below stays in plain strings.
          window = sorted((today - timedelta(days=n)).isoformat()
                          for n in range(1, WINDOW_DAYS + 1))

          # key -> (archive directory, workflow that writes it)
          targets = {
              'social': ('content/social-posts', 'Daily Social Media'),
              'ad':     ('content/ad-archive',   'Daily Website Ad'),
          }

          status = 'ok'
          out = {}

          for key, (directory, label) in targets.items():
              archived = set()
              if os.path.isdir(directory):
                  for name in os.listdir(directory):
                      m = ARCHIVE_FILE.match(name)
                      if m:
                          archived.add(m.group(1))

              # No entries at all -- directory absent, or present but empty.
              # That is "not launched yet" (or a brand new feature), NOT seven
              # missed posts. Report it as no-data and move on; an empty window
              # (_window=0) tells the report to say so rather than alarm.
              if not archived:
                  out[key + '_missing'] = ''
                  out[key + '_count'] = '0'
                  out[key + '_window'] = '0'
                  print("::notice::" + label + ": no archive entries under " + directory
                        + " yet -- treating as not-yet-launched, not as missed posts.")
                  continue

              # Floor at the first day this directory ever recorded.
              earliest = min(archived)
              scanned = [d for d in window if d >= earliest]
              missing = [d for d in scanned if d not in archived]

              out[key + '_missing'] = ','.join(missing)
              out[key + '_count'] = str(len(missing))
              out[key + '_window'] = str(len(scanned))

              if len(missing) >= ESCALATE_AT:
                  status = 'critical'
                  print("::error::" + label + ": no post archived on " + str(len(missing))
                        + " of the last " + str(len(scanned)) + " eligible days ("
                        + ', '.join(missing) + ")")
              elif missing:
                  if status == 'ok':
                      status = 'warn'
                  print("::warning::" + label + ": no post archived on " + missing[0])
              else:
                  print(label + ": all " + str(len(scanned)) + " eligible days accounted for"
                        + " (archive starts " + earliest + ")")

          out['status'] = status

          # Single-line values only, so a plain key=value append is safe here.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for k, v in out.items():
                  f.write(k + "=" + v + "\n")
          PYEOF

      # ================================================================
      # CHECK 12: AI model preflight -- do the configured models still exist?
      #
      # Both 2026 outages were the same failure: a model name in a config file
      # is a claim about someone else's product catalogue, and it rots on their
      # schedule, without notice.
      #
      #   08-17  Groq deleted its entire Llama chat lineup. Both Groq legs died
      #          together -- they shared a vendor, so they were never really
      #          two -- the daily post stopped for 8 days, and the website ad
      #          served canned copy behind a green check.
      #   08-25  The OpenRouter leg, the designated insurance against exactly
      #          that, turned out to name a model OpenRouter had ALSO retired.
      #          Dead for an unknown stretch, and nothing could have revealed
      #          it except calling the API.
      #
      # So call the API. Every 3 days, while the primary still works, so a
      # retirement surfaces as a calm warning instead of an outage found 8 days
      # late. OpenRouter's /models is public; Groq's needs the key.
      # ================================================================

      - name: Check AI models still exist
        id: ai_models
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cd social-agent
          # check-models.js exits 1 when a model is missing, which is the whole
          # point -- do not let that abort the run before the report compiles.
          node check-models.js --json > /tmp/ai-models.json || true
          cat /tmp/ai-models.json

          python3 << 'PYEOF'
          import json, os

          try:
              with open('/tmp/ai-models.json') as f:
                  data = json.load(f)
          except Exception as e:
              out = {'status': 'error', 'missing': '0', 'unchecked': '0',
                     'detail': 'preflight produced no output: ' + str(e)}
          else:
              missing = [r for r in data['results'] if r['status'] == 'missing']
              unchecked = [r for r in data['results'] if r['status'] == 'unchecked']
              status = 'missing' if missing else ('unchecked' if unchecked else 'ok')
              # Semicolons, not newlines: GITHUB_OUTPUT values are single-line
              # here, and a multi-line value would need heredoc framing.
              detail = '; '.join(r['model'] + ' (' + r['where'] + ')'
                                 for r in missing + unchecked)
              out = {'status': status, 'missing': str(len(missing)),
                     'unchecked': str(len(unchecked)), 'detail': detail}

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for k, v in out.items():
                  f.write(k + "=" + v + "\n")
          PYEOF
      # ================================================================
      # REPORT: Compile results and create issue if needed
      # ================================================================
      - name: Compile diagnostic report
        id: report
        env:
          REPO_SIZE_MB: ${{ steps.repo_size.outputs.size_mb }}
          REPO_SIZE_STATUS: ${{ steps.repo_size.outputs.status }}
          WORKFLOW_RESULTS: ${{ steps.workflows.outputs.results }}
          MISSING_SECRETS: ${{ steps.secrets.outputs.missing }}
          CONTENT_ISSUES: ${{ steps.content.outputs.issues }}
          DEPS_FAILED: ${{ steps.deps.outputs.deps_failed }}
          WEBSITE_ISSUES: ${{ steps.website.outputs.issues }}
          QUEUE_STATUS: ${{ steps.clip_queue.outputs.status }}
          QUEUE_STALE_DAYS: ${{ steps.clip_queue.outputs.stale_days }}
          QUEUE_REMAINING: ${{ steps.clip_queue.outputs.remaining }}
          QUEUE_DAYS: ${{ steps.clip_queue.outputs.days_left }}
          SCHED_HEALTH: ${{ steps.sched_health.outputs.results }}
          DAILY_POST_STATUS: ${{ steps.daily_posts.outputs.status }}
          SOCIAL_MISSING: ${{ steps.daily_posts.outputs.social_missing }}
          SOCIAL_MISSING_COUNT: ${{ steps.daily_posts.outputs.social_count }}
          SOCIAL_WINDOW: ${{ steps.daily_posts.outputs.social_window }}
          AD_MISSING: ${{ steps.daily_posts.outputs.ad_missing }}
          AD_MISSING_COUNT: ${{ steps.daily_posts.outputs.ad_count }}
          AD_WINDOW: ${{ steps.daily_posts.outputs.ad_window }}
          FB_STATUS: ${{ steps.fb_token.outputs.status }}
          NL_STATUS: ${{ steps.last_run.outputs.status }}
          NL_DAYS: ${{ steps.last_run.outputs.days_since }}
          AI_MODEL_STATUS: ${{ steps.ai_models.outputs.status }}
          AI_MODEL_MISSING: ${{ steps.ai_models.outputs.missing }}
          AI_MODEL_UNCHECKED: ${{ steps.ai_models.outputs.unchecked }}
          AI_MODEL_DETAIL: ${{ steps.ai_models.outputs.detail }}
        run: |
          python3 << 'PYEOF'
          import json, os

          problems = []
          fixes = []
          warnings = []

          # Workflow checks
          try:
              results = json.loads(os.environ.get('WORKFLOW_RESULTS', '[]'))
              for wf in results:
                  if wf['status'] == 'RE-ENABLED':
                      fixes.append(f"**{wf['name']}** workflow re-enabled")
                  elif wf['status'] != 'OK':
                      problems.append(f"**{wf['name']}** workflow: {wf['status']}")
          except:
              pass

          # Clip queue
          q_status = os.environ.get('QUEUE_STATUS', '')
          q_remaining = os.environ.get('QUEUE_REMAINING', '0')
          q_days = os.environ.get('QUEUE_DAYS', '0')
          if q_status == 'empty':
              problems.append("Clip queue is EMPTY -- Facebook posting has stopped! Run auto-refill locally.")
          elif q_status == 'critical':
              problems.append(f"Clip queue critically low: {q_remaining} clips ({q_days} days). Run auto-refill ASAP.")
          elif q_status == 'low':
              warnings.append(f"Clip queue running low: {q_remaining} clips ({q_days} days left)")
          elif q_status == 'missing':
              problems.append("Clip queue file (queue.json) is missing!")

          # Clips available but nothing going out — posting stalled, not starved.
          try:
              stale_days = int(os.environ.get('QUEUE_STALE_DAYS', '-1'))
          except ValueError:
              stale_days = -1
          if stale_days >= 3 and q_status not in ('empty', 'missing'):
              problems.append(
                  f"No clip has posted in {stale_days} days despite {q_remaining} clips in the queue "
                  "-- posting is stalled, not starved."
              )

          # Repository size. Warning (not problem) at 1 GB: nothing is broken
          # yet at that point, but shrinking it requires a history rewrite and
          # a coordinated force-push, so it needs lead time -- not a surprise
          # the week the push limit is hit.
          repo_size_mb = os.environ.get('REPO_SIZE_MB', '?')
          repo_size_status = os.environ.get('REPO_SIZE_STATUS', '')
          if repo_size_status == 'critical':
              problems.append(
                  f"Repository is {repo_size_mb} MB -- past 2 GB, headed for GitHub's 5 GB "
                  "push limit. Clips in git history are the cause. Plan a history rewrite "
                  "or move clips out of git."
              )
          elif repo_size_status == 'warn':
              warnings.append(
                  f"Repository is {repo_size_mb} MB, over GitHub's recommended 1 GB. "
                  "Growth is ~40 MB/month from clips kept in git history."
              )

          # Per-workflow scheduled-run health (clip-poster, social-media)
          sched_summary = []
          try:
              sched_results = json.loads(os.environ.get('SCHED_HEALTH', '[]'))
          except Exception:
              sched_results = []
          for wf in sched_results:
              name = wf.get('name', '?')
              status = wf.get('status', '?')
              age = wf.get('last_sched_success_age_h')
              age_str = f"{age}h ago" if age is not None else "never"
              sched_summary.append(f"  - {name}: {status} (last scheduled success: {age_str})")
              if status == 'startup_failure':
                  problems.append(
                      f"**{name}**: workflow YAML failed to parse "
                      f"(startup_failure × {wf.get('startup_failures',0)}). "
                      f"Inspect `.github/workflows/{wf.get('file','?')}` — common cause is "
                      f"a multiline bash string in `run: |` whose continuation lines are not "
                      f"indented to the block's base. Fix and push to re-register."
                  )
              elif status == 'schedule_stalled':
                  problems.append(
                      f"**{name}**: schedule dormant — last successful scheduled run was "
                      f"{age}h ago (alert threshold {wf.get('threshold_h','?')}h). "
                      f"Trigger a manual `workflow_dispatch` run to re-arm GitHub's scheduler."
                  )
              elif status == 'no_scheduled_success':
                  problems.append(
                      f"**{name}**: no successful scheduled run in last 10 attempts. "
                      f"Schedule may be throttled. Manually dispatch to re-arm."
                  )
              elif status == 'failing':
                  problems.append(
                      f"**{name}**: failing — {wf.get('recent_failures',0)} of last 5 runs failed."
                  )
              elif status == 'missing':
                  problems.append(f"**{name}**: workflow not found in repo!")
              elif status == 'never_run':
                  warnings.append(f"**{name}**: has never run yet")

          # Daily post archives -- proof a post actually landed, per day.
          # The block above only proves the workflow ran; a gate job can skip
          # the posting job and still conclude success, so a silent zero-post
          # day looks identical to a healthy one there. Here we count the
          # <YYYY-MM-DD>.json files the posters commit. One gap in 7 days is a
          # warning (GitHub infrastructure, self-heals); two or more is a
          # broken poster and gets escalated to a problem.
          DAILY_WINDOW = 7
          daily_summary = []
          for env_key, label in (('SOCIAL', 'Daily Social Media'),
                                 ('AD', 'Daily Website Ad')):
              raw = os.environ.get(f'{env_key}_MISSING', '').strip()

              def _num(suffix):
                  try:
                      return int(os.environ.get(f'{env_key}_{suffix}', '0') or '0')
                  except ValueError:
                      return 0

              miss_count = _num('MISSING_COUNT')
              # Days actually eligible for scrutiny: the 7-day window floored at
              # the archive's first ever entry, so a feature that shipped mid
              # window is never blamed for the days before it existed.
              scanned = _num('WINDOW')
              miss_dates = [d for d in raw.split(',') if d]

              # scanned == 0 means the archive is empty or absent -- not yet
              # launched. Nothing to conclude, so say that and skip the alarms.
              if scanned == 0:
                  daily_summary.append(f"  - {label}: no archive data yet (not launched)")
                  continue

              if miss_count >= 2:
                  problems.append(
                      f"**{label}**: no post was archived on {miss_count} of the last "
                      f"{scanned} eligible days ({', '.join(miss_dates)}). The workflow runs may "
                      f"all look green -- its gate job can skip the posting job and still "
                      f"conclude success -- so believe the archive, not the checkmarks."
                  )
              elif miss_count == 1:
                  warnings.append(
                      f"**{label}**: no post archived on {miss_dates[0]} "
                      f"(1 missing day out of {scanned}). Isolated misses are usually GitHub "
                      f"infrastructure and self-heal on the next cron; two or more means the "
                      f"poster itself is broken."
                  )

              detail = f" (missing {', '.join(miss_dates)})" if miss_dates else ""
              daily_summary.append(
                  f"  - {label}: {scanned - miss_count}/{scanned} days posted{detail}"
              )

          # AI model preflight -- see CHECK 12 for why this is its own alarm.
          # A missing model is a PROBLEM, not a warning: every call using it
          # 404s, and the failure is invisible in the workflow's exit code
          # because the agents catch it and archive the error instead.
          ai_status = os.environ.get('AI_MODEL_STATUS', '')
          ai_detail = os.environ.get('AI_MODEL_DETAIL', '').strip()
          ai_missing = os.environ.get('AI_MODEL_MISSING', '0')
          if ai_status == 'missing':
              problems.append(
                  f"{ai_missing} AI model(s) NO LONGER EXIST at the provider -- "
                  f"content generation will 404: `{ai_detail}`. "
                  "List what is actually served with "
                  "`curl -H \"Authorization: Bearer $GROQ_API_KEY\" https://api.groq.com/openai/v1/models` "
                  "or `curl https://openrouter.ai/api/v1/models`, then repoint the config."
              )
          elif ai_status == 'unchecked':
              # Not a pass. It means we do not know, which is how the OpenRouter
              # leg stayed dead without anyone noticing.
              warnings.append(
                  f"Could not verify some AI models (missing key or network): `{ai_detail}`"
              )
          elif ai_status == 'error':
              warnings.append(f"AI model preflight did not run: {ai_detail}")

          # Facebook token
          fb = os.environ.get('FB_STATUS', '')
          if fb == 'expired':
              problems.append("Facebook API token is EXPIRED -- clips cannot post until renewed")
          elif fb == 'missing':
              problems.append("Facebook secrets not configured")

          # Secrets
          missing = os.environ.get('MISSING_SECRETS', '').strip()
          if missing:
              problems.append(f"Missing secrets: `{missing}`")

          # Content
          content = os.environ.get('CONTENT_ISSUES', '').strip()
          if content:
              problems.append(f"Content file issues: {content}")

          # Deps
          if os.environ.get('DEPS_FAILED') == 'true':
              problems.append("newsletter-agent npm install failed")

          # Website
          web = os.environ.get('WEBSITE_ISSUES', '').strip()
          if web:
              problems.append(f"Website errors: {web}")

          # Newsletter
          nl = os.environ.get('NL_STATUS', '')
          nl_days = os.environ.get('NL_DAYS', '0')
          if nl == 'failure':
              problems.append("Last newsletter run failed")
          if nl_days and int(nl_days) > 35:
              warnings.append(f"Newsletter last ran {nl_days} days ago")

          # Build report
          from datetime import datetime
          date = datetime.utcnow().strftime('%A, %B %d, %Y')
          lines = [f"## System Diagnostics -- {date}", ""]

          if fixes:
              lines.append("### Auto-Fixed")
              for f in fixes:
                  lines.append(f"- {f}")
              lines.append("")

          if problems:
              lines.append(f"### Problems ({len(problems)})")
              for p in problems:
                  lines.append(f"- {p}")
              lines.append("")

          if warnings:
              lines.append(f"### Warnings ({len(warnings)})")
              for w in warnings:
                  lines.append(f"- {w}")
              lines.append("")

          # Status summary
          lines.append("### System Status")
          lines.append(f"- Clip Queue: {q_remaining} clips ({q_days} days at 2/day)")
          lines.append(f"- Scheduled workflows:")
          if sched_summary:
              lines.extend(sched_summary)
          else:
              lines.append("  - (no data)")
          lines.append(f"- Daily posts archived (last {DAILY_WINDOW} complete UTC days):")
          if daily_summary:
              lines.extend(daily_summary)
          else:
              lines.append("  - (no data)")
          lines.append(f"- Facebook Token: {'Valid' if fb == 'ok' else fb}")
          lines.append(f"- Website: {'OK' if not web else 'Issues'}")
          lines.append(f"- Newsletter: {nl} (last {nl_days} days ago)")
          lines.append(f"- Repo Size: {repo_size_mb} MB ({repo_size_status or 'unknown'}; warn at 1024 MB)")

          if not problems and not warnings:
              lines.append("")
              lines.append("### All Systems Healthy")

          # ============================================================
          # Persistence tracking
          # ============================================================
          # Why this exists: before 2026-08-01 every run closed the previous
          # diagnostics issue and opened a fresh one. The repo therefore always
          # showed exactly ONE open issue with an identical title, whether the
          # problem was 3 days old or 62. The clip queue sat empty for two
          # months while this alarm faithfully reset itself every 3 days.
          #
          # We now remember when each distinct problem was FIRST seen, so the
          # issue title can escalate and stop reading as routine noise.
          import re
          from datetime import datetime, timezone

          STATE_FILE = '.github/diagnostics-state.json'

          def problem_key(text):
              """Stable signature for a problem, ignoring volatile numbers.

              '...last successful run was 15h ago' and '...was 39h ago' are the
              same ongoing problem, so digits are stripped before hashing.
              """
              t = re.sub(r'\d+', '', text.lower())
              t = re.sub(r'[^a-z ]', ' ', t)
              return '-'.join(t.split()[:6])

          now = datetime.now(timezone.utc)

          state = {'problems': {}}
          if os.path.exists(STATE_FILE):
              try:
                  with open(STATE_FILE) as f:
                      state = json.load(f)
              except Exception:
                  pass
          state.setdefault('problems', {})

          current = {problem_key(p): p for p in problems}
          # Snapshot the prior problems before state['problems'] is rebuilt below,
          # otherwise the resolved-items report has nothing left to look up.
          previous = dict(state['problems'])
          resolved = [k for k in previous if k not in current]

          tracked = {}
          for key, text in current.items():
              prior = state['problems'].get(key)
              first_seen = prior['first_seen'] if prior else now.isoformat()
              try:
                  age_days = (now - datetime.fromisoformat(first_seen)).days
              except Exception:
                  first_seen, age_days = now.isoformat(), 0
              tracked[key] = {
                  'first_seen': first_seen,
                  'text': text,
                  'detections': (prior['detections'] + 1) if prior else 1,
                  'age_days': age_days,
              }

          state['problems'] = {k: {key: v[key] for key in ('first_seen', 'text', 'detections')}
                               for k, v in tracked.items()}
          state['last_run'] = now.isoformat()

          os.makedirs(os.path.dirname(STATE_FILE), exist_ok=True)
          with open(STATE_FILE, 'w') as f:
              json.dump(state, f, indent=2)

          max_age = max((v['age_days'] for v in tracked.values()), default=0)
          new_problems = [v['text'] for v in tracked.values() if v['detections'] == 1]

          # Escalation banner — the part that makes a stale alarm impossible to
          # mistake for a fresh one.
          if tracked:
              banner = []
              if max_age >= 14:
                  banner.append(f"## UNRESOLVED FOR {max_age} DAYS -- PLEASE ACT")
              elif max_age >= 7:
                  banner.append(f"## Unresolved for {max_age} days")
              if banner:
                  banner.append("")
                  lines = banner + lines

              lines.append("")
              lines.append("### How long each problem has been open")
              for v in sorted(tracked.values(), key=lambda x: -x['age_days']):
                  age = "first seen this run" if v['age_days'] == 0 else f"{v['age_days']}d ago"
                  lines.append(f"- ({age}, {v['detections']} detections) {v['text']}")

          if resolved:
              lines.append("")
              lines.append("### Resolved since last run")
              for k in resolved:
                  lines.append(f"- {previous.get(k, {}).get('text', k)}")

          report = '\n'.join(lines)
          print(report)

          has_problems = 'true' if problems else 'false'

          # Title carries the actual severity now, not just a count.
          if problems:
              if max_age >= 14:
                  title = f"CRITICAL: {problems[0][:60]} -- unresolved {max_age} days"
              elif max_age >= 7:
                  title = f"{len(problems)} issue(s) -- oldest {max_age} days old"
              else:
                  title = f"Diagnostics: {len(problems)} issue(s) found"
          else:
              title = "Diagnostics: all clear"

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"issue_title={title}\n")
              f.write(f"max_age_days={max_age}\n")
              f.write(f"new_problem_count={len(new_problems)}\n")

          # Write outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"has_problems={has_problems}\n")
              f.write(f"problem_count={len(problems)}\n")
              f.write(f"fix_count={len(fixes)}\n")
              f.write(f"warning_count={len(warnings)}\n")

          # Write report to file for next step
          with open('/tmp/diag_report.md', 'w') as f:
              f.write(report)
          PYEOF

      # ================================================================
      # Create issue only if there are unfixed problems
      # ================================================================
      - name: Create or update diagnostic issue
        if: steps.report.outputs.has_problems == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/diag_report.md', 'utf8');
            const title = `${{ steps.report.outputs.issue_title }}`;
            const maxAge = parseInt('${{ steps.report.outputs.max_age_days }}' || '0', 10);
            const newCount = parseInt('${{ steps.report.outputs.new_problem_count }}' || '0', 10);
            const body = report + '\n\n---\n*Auto-generated by System Diagnostics (runs every 3 days)*';

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'diagnostics',
              state: 'open'
            });

            // Keep ONE long-lived issue and update it in place. Closing and
            // recreating (the old behaviour) destroyed all sense of duration
            // and let a 62-day outage keep looking like a brand new report.
            if (existing.length > 0) {
              const issue = existing[0];
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title: title,
                body: body
              });

              // Comment only on genuine changes — a comment every 3 days is
              // exactly the noise that trained everyone to ignore this.
              const milestones = [3, 7, 14, 30, 60];
              const shouldComment = newCount > 0 || milestones.includes(maxAge);
              if (shouldComment) {
                const note = newCount > 0
                  ? `${newCount} new problem(s) detected.`
                  : `Still unresolved after ${maxAge} days.`;
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `${note}\n\n${body}`
                });
              }

              // Stale critical problems get pinned so they surface above noise.
              if (maxAge >= 14) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['critical']
                }).catch(() => {});
              }

              // Re-assign if it ever lost its assignee — no assignee, no email.
              if (!issue.assignees || issue.assignees.length === 0) {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: ['pastorcurtis']
                }).catch(() => {});
              }
            } else {
              // Assigned, not just labelled: assignment is what actually sends
              // Curtis an email. The old unassigned issues generated no push
              // notification at all, which is how 21 of them went unread.
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['diagnostics'],
                assignees: ['pastorcurtis']
              });
            }

      # ================================================================
      # Close the tracking issue when everything actually recovers
      # ================================================================
      # Deliver the report to a human when something NEWLY breaks.
      #
      # Gated on new_problem_count rather than has_problems on purpose. This
      # workflow keeps one long-lived issue and updates it in place, so a
      # known ongoing problem would otherwise email every 3 days until fixed
      # and train exactly the reflex that made the August outage possible --
      # an alert you have learned to ignore is worse than no alert, because it
      # still feels like coverage. A problem that persists stays visible in the
      # issue and in the report; email is reserved for "something changed for
      # the worse". The daily social and ad alarms cover the acute cases.
      - name: Email new problems
        if: steps.report.outputs.has_problems == 'true' && steps.report.outputs.new_problem_count != '0'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          COUNT="${{ steps.report.outputs.new_problem_count }}"
          node .github/scripts/send-alert.js \
            --subject "IFM diagnostics: $COUNT new problem(s) found" \
            --body-file /tmp/diag_report.md \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Resolve diagnostic issue
        if: steps.report.outputs.has_problems == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'diagnostics',
              state: 'open'
            });
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'All checks passing. Closing automatically.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }

      # ================================================================
      # Persist problem-age state so duration survives across runs
      # ================================================================
      - name: Commit diagnostics state
        if: always()
        run: |
          if [ -n "$(git status --porcelain .github/diagnostics-state.json)" ]; then
            git config user.name "IFM Diagnostics Bot"
            git config user.email "bot@increasingfaith.net"
            git add .github/diagnostics-state.json
            git commit -m "Diagnostics: update problem-age state"
            git pull --rebase origin main
            git push
          else
            echo "No state change to commit."
          fi

      # ================================================================
      # Log clean bill of health
      # ================================================================
      - name: Report clean health
        if: steps.report.outputs.has_problems == 'false'
        env:
          QUEUE_REMAINING: ${{ steps.clip_queue.outputs.remaining }}
          DAILY_POST_STATUS: ${{ steps.daily_posts.outputs.status }}
          SOCIAL_MISSING_COUNT: ${{ steps.daily_posts.outputs.social_count }}
          AD_MISSING_COUNT: ${{ steps.daily_posts.outputs.ad_count }}
        run: |
          echo "========================================"
          echo "  SYSTEM DIAGNOSTICS: ALL CLEAR"
          echo "========================================"
          echo "  Workflows:      OK"
          echo "  Clip Queue:     OK ($QUEUE_REMAINING clips)"
          echo "  Clip Poster:    OK"
          # Reported as a status word, not a flat OK: this step also runs when
          # the only finding was a single missing post day, which is a warning
          # and never sets has_problems. Printing "OK" there would hide it.
          echo "  Daily Posts:    ${DAILY_POST_STATUS:-unknown} (missing days -- social: ${SOCIAL_MISSING_COUNT:-?}, ad: ${AD_MISSING_COUNT:-?})"
          echo "  Facebook Token: OK"
          echo "  Secrets:        OK"
          echo "  Content:        OK"
          echo "  Website:        OK"
          echo "  Newsletter:     OK"
          echo "========================================"
